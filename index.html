function b64d(s){const bin=atob(s);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr;}
async function unlock(){
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('err');
  err.textContent='';
  if(!pw){err.textContent='Enter a passphrase.';return;}
  try{
    const enc=new TextEncoder();
    const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64d(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:'SHA-256'},
      keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']
    );
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(PAYLOAD.iv)},key,b64d(PAYLOAD.ct));
    const html=new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }catch(e){
    err.textContent='Incorrect passphrase.';
  }
}
document.getElementById('go').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});
